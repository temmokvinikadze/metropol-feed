name: Update Meta catalog feed

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Self-test
        run: python tests/test_build_feed.py

      - name: Build feeds from metropol.ge
        env:
          PRICE_CURRENCY: GEL   # GEL = lari via metropol.ge/api/rate; USD = original CRM price
          INCLUDE_PROJECTS: "kavtaradze,ortachala"   # slugs, comma-separated; empty = all projects
          MIN_ITEMS: "50"
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python scripts/build_feed.py .

      - name: Commit if changed
        run: |
          git config user.name  "metropol-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.xml feed_en.xml images/ 2>/dev/null || git add feed.xml feed_en.xml
          if git diff --cached --quiet; then
            echo "No inventory changes."
          else
            git commit -m "Update catalog feed $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
