name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in "https://crm.metropol.ge/upload/iblock/e32/r3ace9lntihjykqcftdohc6u4vohbkrq/1791053860150.png" "https://crm.metropol.ge/upload/iblock/ffb/w4fc6xia6vka1hcokjbxhweqwxk69f9g/1791054242230.png" "https://www.metropol.ge/og-default.jpg"; do
            r=$(curl -sS -o /dev/null -m 40 -A "Mozilla/5.0" -w "code=%{http_code} type=%{content_type} size=%{size_download} connect=%{time_connect}s total=%{time_total}s" "$u" 2>&1 | tr '\n' ' ')
            echo "::warning::$u => $r"
          done
          r=$(curl -sS -o /dev/null -m 40 -A "facebookexternalhit/1.1" -w "code=%{http_code} size=%{size_download} total=%{time_total}s" "https://crm.metropol.ge/upload/iblock/e32/r3ace9lntihjykqcftdohc6u4vohbkrq/1791053860150.png" 2>&1 | tr '\n' ' ')
          echo "::warning::FB-UA => $r"
